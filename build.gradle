plugins {
    id "architectury-plugin" version "3.4.160"
    id "dev.architectury.loom" version "1.13.467" apply false
    id "com.gradleup.shadow" version "8.3.0" apply false
}

architectury {
    minecraft = minecraft_version
}

group = mod_group_id
version = mod_version

def getBuildNumber() {
    if (project.hasProperty("buildNumber") && project.property("buildNumber").toString().trim()) {
        return project.property("buildNumber").toString().trim()
    }
    if (project.hasProperty("build_number") && project.property("build_number").toString().trim()) {
        return project.property("build_number").toString().trim()
    }
    if (System.getenv("BUILD_NUMBER") != null && !System.getenv("BUILD_NUMBER").isEmpty()) {
        return System.getenv("BUILD_NUMBER").trim()
    }
    File changelogFile = rootProject.file("changelog.md")
    if (changelogFile.exists()) {
        def line = changelogFile.readLines().find { it.startsWith("## Build ") }
        if (line) {
            return line.replace("## Build ", "").trim()
        }
    }
    if (project.hasProperty("mod_version_major") && project.hasProperty("mod_version_build")) {
        return "${project.property('mod_version_major')}-${project.property('mod_version_build')}"
    }
    return "dev"
}

ext.buildNumber = getBuildNumber()

def getJarSuffix() {
    def bn = ext.buildNumber.toString().trim()
    if (bn.startsWith("v") || bn.startsWith("V")) {
        return "-${bn}"
    } else if (bn.toLowerCase().startsWith("build-") || bn.toLowerCase().startsWith("build_")) {
        return "-${bn}"
    } else {
        return "-build-${bn}"
    }
}

ext.jarSuffix = getJarSuffix()

subprojects {
    group = mod_group_id
    version = mod_version

    apply plugin: "java"
    apply plugin: "maven-publish"

    plugins.withId("architectury-plugin") {
        architectury {
            minecraft = minecraft_version
        }
    }

    plugins.withId("dev.architectury.loom") {
        loom {
            // Loom configurations
        }

        dependencies {
            minecraft "com.mojang:minecraft:${minecraft_version}"
            mappings loom.officialMojangMappings()
        }
    }

    java {
        withSourcesJar()
    }

    // Ensure remapSourcesJar always depends on sourcesJar execution
    tasks.matching { it.name == "remapSourcesJar" }.configureEach {
        dependsOn(tasks.named("sourcesJar"))
        inputFile.set(tasks.named("sourcesJar").flatMap { it.archiveFile })
    }
}

allprojects {
    version = mod_version
    group = mod_group_id

    repositories {
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.terraformersmc.com/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.blamejared.com/" }
        maven { url "https://modmaven.dev/" }
        maven { url "https://maven.wispforest.io/releases" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.theillusivec4.top/" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }
}