<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropica | Official Fan Wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.154.0/three.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <h1 id="home-btn" class="logo">ENTROPICA</h1>
        </div>
        
        <ul id="top-nav" class="nav-center">
            <!-- Navigation categories with dropdowns will be injected here -->
        </ul>

        <div class="nav-right">
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="wiki-search" placeholder="Search...">
            </div>
            <button id="theme-toggle" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <main id="main-content">
        <section id="content-area">
            <!-- Content will be injected here by wiki.js -->
        </section>
    </main>

    <script src="data.js"></script>
    <script src="wiki.js"></script>
</body>
</html>
