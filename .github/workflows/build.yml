name: Build & Release

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Entropica-Jars
          path: |
            fabric/build/libs/Entropica-fabric-*.jar
            neoforge/build/libs/Entropica-neoforge-*.jar
            !**/*-dev-shadow.jar

      - name: Extract Release Metadata & Notes
        id: meta
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          
          MOD_VER=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "mod_version=${MOD_VER:-1.0.0}" >> $GITHUB_OUTPUT
          
          if [ -f changelog.md ]; then
            awk '/^## /{if (found++) exit} found' changelog.md > release_notes.txt
          fi
          
          if [ ! -s release_notes.txt ]; then
            git log -1 --pretty=format:"### Commit Summary%n%s%n%n%b" > release_notes.txt
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        with:
          tag_name: "v${{ steps.meta.outputs.mod_version }}-build.${{ github.run_number }}"
          name: "Entropica v${{ steps.meta.outputs.mod_version }} - Build #${{ github.run_number }} (${{ steps.meta.outputs.sha_short }})"
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            fabric/build/libs/Entropica-fabric-*.jar
            neoforge/build/libs/Entropica-neoforge-*.jar
            !**/*-dev-shadow.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}